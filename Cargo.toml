[package]
name = "zed-vertical-align-extension"
version = "0.1.6"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = [
    "crates/vertical-align-core",
    "crates/zed-vertical-align-lsp",
]
resolver = "2"

[dependencies]
zed_extension_api = "0.7.0"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
